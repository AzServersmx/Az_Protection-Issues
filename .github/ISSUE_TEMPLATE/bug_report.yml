name: "Reportar un error"
description: "Informa de un problema con Az_Protection."
title: "[Error] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Gracias por ayudar a mejorar Az_Protection. No compartas contraseñas, direcciones IP privadas ni datos personales."
  - type: input
    id: version
    attributes:
      label: "Versión de Az_Protection"
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: "Versión de Minecraft y software del servidor"
      placeholder: "Minecraft 26.3 / Paper 26.3"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Descripción del problema"
      description: "Explica qué ocurrió."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Pasos para reproducirlo"
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Comportamiento esperado"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Registros o capturas (opcional)"
      description: "Elimina tokens, contraseñas y datos privados antes de compartir."
    validations:
      required: false
